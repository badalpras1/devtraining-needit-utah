<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Group Leads</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">&#128100;</div>
    <div>
      <h1>FB Group Leads</h1>
      <p id="status-bar" class="status">Navigate to a Facebook Group to begin.</p>
    </div>
  </div>

  <div class="controls">
    <div class="mode-row">
      <label class="mode-label">Extract from:</label>
      <select id="mode-select">
        <option value="auto">Auto detect</option>
        <option value="posts">Feed posts</option>
        <option value="members">Members list</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="btn-extract" class="btn primary">&#128269; Extract Leads</button>
      <button id="btn-scroll"  class="btn secondary">&#8615; Auto-scroll</button>
      <button id="btn-enrich"  class="btn accent">&#9889; Enrich Profiles</button>
    </div>

    <div class="btn-row">
      <button id="btn-export-csv"  class="btn success">&#8595; CSV</button>
      <button id="btn-export-json" class="btn success">&#8495; JSON</button>
      <button id="btn-clear"       class="btn danger">&#128465; Clear</button>
    </div>
  </div>

  <!-- Enrichment progress bar (shown during enrichment) -->
  <div id="enrich-bar" class="enrich-bar" style="display:none">
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <span id="progress-text" class="progress-text">0 / 0</span>
    <button id="btn-stop-enrich" class="btn danger sm">&#9632; Stop</button>
  </div>
  <div id="progress-label" class="progress-label" style="display:none"></div>

  <div class="stats-row">
    <span id="count-badge"   class="badge">0 leads stored</span>
    <span id="session-badge" class="badge secondary">0 new this session</span>
    <span id="enrich-badge"  class="badge accent"    style="display:none">0 enriched</span>
  </div>

  <div id="debug-box" class="debug-box" style="display:none"></div>

  <div class="table-wrap">
    <table id="leads-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Profile</th>
          <th>Email</th>
          <th>Phone</th>
          <th>WhatsApp</th>
          <th>Website</th>
          <th>Work</th>
          <th>Location</th>
          <th>Post Snippet</th>
          <th>Src</th>
        </tr>
      </thead>
      <tbody id="leads-body">
        <tr id="empty-row">
          <td colspan="11" class="empty">No leads yet. Extract from a Facebook Group page.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="popup.js"></script>
</body>
</html>
